<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kim Sijun · Sprout Studio</title>
    <meta name="description" content="Sprout Studio · Kim Sijun link hub" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Great+Vibes&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="paper" aria-hidden="true"></div>
    <img class="watermark" src="assets/sprout-mark.svg" alt="" aria-hidden="true" />

    <div class="page">
      <header class="topbar">
        <button class="icon-btn" type="button" id="brandMark" data-i18n-aria="brandAria" aria-label="Sprout Studio" title="Sprout Studio">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M12 20c0-4.2 1.7-7.3 4.9-9.5C14.6 8.2 13 5.9 12 3.2c-1 2.7-2.6 5-4.9 7.3C10.3 12.7 12 15.8 12 20z"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linejoin="round"
            />
            <path
              d="M12 20V10.5"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
            />
          </svg>
        </button>
        <div class="topbar-actions">
          <button class="lang-btn" type="button" id="langBtn" aria-label="한국어로 전환">
            KO
          </button>
          <button class="icon-btn" type="button" id="shareBtn" data-i18n-aria="shareAria" aria-label="Share">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M12 3v10m0-10l3.5 3.5M12 3L8.5 6.5M6 11v7a2 2 0 002 2h8a2 2 0 002-2v-7"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        </div>
      </header>

      <main class="content">
        <section class="profile">
          <div class="wordmark" aria-label="THE Sprout STUDIO">
            <span class="wm-small">THE</span>
            <span class="wm-script">Sprout</span>
            <span class="wm-small">STUDIO</span>
          </div>

          <p class="studio" data-i18n="studio">Sprout Studio</p>
          <h1 class="name">
            <span class="name-primary" data-i18n="namePrimary">Kim Sijun</span>
            <span class="name-secondary" data-i18n="nameSecondary">김시준</span>
          </h1>
          <p class="bio" data-i18n="bio">Solo production studio</p>

          <nav class="socials" data-i18n-aria="socialsAria" aria-label="Social links">
            <a
              class="social"
              href="https://www.instagram.com/madeby.sprout/"
              aria-label="Instagram"
              title="@madeby.sprout"
              target="_blank"
              rel="noopener noreferrer"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect
                  x="3"
                  y="3"
                  width="18"
                  height="18"
                  rx="5"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.6"
                />
                <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.6" />
                <circle cx="17.5" cy="6.5" r="1.05" fill="currentColor" />
              </svg>
            </a>
            <a
              class="social"
              href="https://x.com/madeby_sprout"
              aria-label="X"
              title="@madeby_sprout"
              target="_blank"
              rel="noopener noreferrer"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M5 5l14 14M19 5L5 19"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.9"
                  stroke-linecap="round"
                />
              </svg>
            </a>
            <a
              class="social"
              href="mailto:madeby.sproutstudio@gmail.com"
              aria-label="Email"
              title="madeby.sproutstudio@gmail.com"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect
                  x="3"
                  y="6"
                  width="18"
                  height="12"
                  rx="2.2"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.6"
                />
                <path
                  d="M4 8l8 5.5L20 8"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </a>
          </nav>
        </section>

        <section class="links" data-i18n-aria="linksAria" aria-label="Main links">
          <a
            class="link-btn"
            href="https://greenbraird.github.io/SproutStudioWeb/"
            data-label="Website"
            target="_blank"
            rel="noopener noreferrer"
          >
            <span class="link-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="8.2" fill="none" stroke="currentColor" stroke-width="1.5" />
                <path
                  d="M4 12h16M12 3.8c2.2 2.4 3.3 5 3.3 8.2S14.2 17.8 12 20.2M12 3.8C9.8 6.2 8.7 8.8 8.7 12S9.8 17.8 12 20.2"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.4"
                />
              </svg>
            </span>
            <span class="link-text" data-i18n="website">Website</span>
            <button
              class="more-btn"
              type="button"
              aria-label="링크 옵션"
              data-url="https://greenbraird.github.io/SproutStudioWeb/"
            >
              <span></span><span></span><span></span>
            </button>
          </a>

          <a
            class="link-btn"
            href="https://www.instagram.com/madeby.sprout/"
            data-label="Instagram"
            target="_blank"
            rel="noopener noreferrer"
          >
            <span class="link-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <rect
                  x="3"
                  y="3"
                  width="18"
                  height="18"
                  rx="5"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.5"
                />
                <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.5" />
                <circle cx="17.5" cy="6.5" r="1" fill="currentColor" />
              </svg>
            </span>
            <span class="link-text">Instagram</span>
            <button
              class="more-btn"
              type="button"
              aria-label="링크 옵션"
              data-url="https://www.instagram.com/madeby.sprout/"
            >
              <span></span><span></span><span></span>
            </button>
          </a>

          <a
            class="link-btn"
            href="https://x.com/madeby_sprout"
            data-label="X"
            target="_blank"
            rel="noopener noreferrer"
          >
            <span class="link-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path
                  d="M5 5l14 14M19 5L5 19"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                />
              </svg>
            </span>
            <span class="link-text">X</span>
            <button
              class="more-btn"
              type="button"
              aria-label="링크 옵션"
              data-url="https://x.com/madeby_sprout"
            >
              <span></span><span></span><span></span>
            </button>
          </a>

          <a class="link-btn" href="mailto:madeby.sproutstudio@gmail.com" data-label="Email">
            <span class="link-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <rect
                  x="3"
                  y="6"
                  width="18"
                  height="12"
                  rx="2.2"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.5"
                />
                <path
                  d="M4 8l8 5.5L20 8"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </span>
            <span class="link-text">Email</span>
            <button
              class="more-btn"
              type="button"
              aria-label="링크 옵션"
              data-url="mailto:madeby.sproutstudio@gmail.com"
            >
              <span></span><span></span><span></span>
            </button>
          </a>
        </section>

        <section class="section-head">
          <h2 data-i18n="projectsTitle">▼ Projects ▼</h2>
          <p data-i18n="projectsSub">Things growing now</p>
        </section>

        <section class="links featured" data-i18n-aria="projectsAria" aria-label="Project links">
          <a
            class="link-btn"
            href="https://store.steampowered.com/app/4949240/War_In_The_Dark/"
            data-label="War In The Dark"
            target="_blank"
            rel="noopener noreferrer"
          >
            <img class="thumb" src="assets/Logo.png" alt="" width="40" height="40" />
            <span class="link-text">War In The Dark</span>
            <button
              class="more-btn"
              type="button"
              aria-label="링크 옵션"
              data-url="https://store.steampowered.com/app/4949240/War_In_The_Dark/"
            >
              <span></span><span></span><span></span>
            </button>
          </a>
        </section>

        <footer class="footer">
          <p>made by sprout</p>
        </footer>
      </main>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="script.js"></script>
  </body>
</html>
